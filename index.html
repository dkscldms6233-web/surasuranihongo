<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>술술 일본어 | 일본어 초보도 쉽고 재밌게!</title>
<meta name="description" content="히라가나부터 하루 5분씩, 게임하면서 즐겁게 배우는 술술 일본어.">
<style>
:root{--navy:#2d4a7c;--navy2:#1f3559;--ink:#17203a;--mut:#5d6882;--line:#e3e8f2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Malgun Gothic",sans-serif;color:var(--ink);background:#fff;font-size:18px;line-height:1.6;padding-bottom:96px}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}

/* 맨 위 바 */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy2);font-size:20px;text-decoration:none}
.logo img{width:44px;height:auto}
.mini{background:var(--navy);color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800;text-decoration:none}

/* 첫 화면: 큰 글자 한 줄 + 버튼 하나 */
.hero{text-align:center;padding:28px 0 56px}
.mascot{width:190px;height:auto;display:block;margin:0 auto 18px}
h1{font-size:clamp(40px,11vw,72px);line-height:1.18;margin:0 0 18px;font-weight:900;letter-spacing:-.02em;color:var(--navy2)}
h1 em{font-style:normal;color:var(--navy);background:linear-gradient(transparent 62%,#ffe27a 62%)}
.hero p{font-size:clamp(19px,4.4vw,24px);color:var(--mut);margin:0 auto 30px;max-width:19em;font-weight:600}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:18px;padding:18px 44px;font-size:20px;font-weight:900;text-decoration:none;cursor:pointer;font-family:inherit;box-shadow:0 6px 0 var(--navy2)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy2)}

/* 배우는 것: 색깔 타일 */
.learn{background:#f4f6fb;padding:52px 0 60px}
h2{font-size:clamp(28px,7vw,40px);line-height:1.25;margin:0 0 8px;font-weight:900;color:var(--navy2);text-align:center}
.lead{text-align:center;color:var(--mut);margin:0 0 30px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:560px;margin:0 auto}
.tile{border-radius:24px;padding:22px 8px 16px;text-align:center;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.tile i{display:block;font-style:normal;font-size:46px;line-height:1.1;margin-bottom:8px}
.tile span{font-size:16px}
.t1{background:#ffd9e2;color:#8a2142;transform:rotate(-3deg)}
.t2{background:#ffeaa0;color:#7a5600;transform:rotate(2deg)}
.t3{background:#cfeee0;color:#145a3e;transform:rotate(-2deg)}
.t4{background:#dcd6ff;color:#3f2f9a;transform:rotate(3deg)}
.t5{background:#cfe3ff;color:#1c4a8f;transform:rotate(-3deg)}
.t6{background:#ffd9c2;color:#8a3a10;transform:rotate(2deg)}
.note{text-align:center;color:var(--mut);margin:26px 0 0;font-weight:700}

/* 미니게임 */
.play{padding:56px 0}
.game{background:#fff;border:3px solid var(--line);border-radius:26px;padding:24px 20px 28px;box-shadow:0 6px 0 var(--line);text-align:center;max-width:460px;margin:0 auto}
.gbar{height:12px;border-radius:99px;background:#e6e9f0;overflow:hidden;margin-bottom:6px}
.gbar i{display:block;height:100%;width:0;background:#58cc86;border-radius:99px;transition:width .3s}
.gcount{font-size:14px;font-weight:800;color:var(--mut);margin-bottom:14px}
.big{font-size:110px;line-height:1.1;font-weight:900;color:var(--navy2);margin:6px 0 4px}
.ask-q{font-weight:800;color:var(--mut);margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-size:26px;font-weight:900;padding:16px 0;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--navy2);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.right{background:#d7f5e3;border-color:#58cc86;box-shadow:0 5px 0 #58cc86;color:#145a3e}
.opt.wrong{background:#ffe0e0;border-color:#ff7b7b;box-shadow:0 5px 0 #ff7b7b;color:#8a1c1c}
.fb{min-height:28px;margin-top:16px;font-weight:900;font-size:20px}
.score{font-size:64px;font-weight:900;color:var(--navy2);line-height:1.2}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn.light{background:#fff;color:var(--navy2);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}

/* 문의 */
.ask{padding:56px 0 40px}
form{background:#fff;border:3px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 6px 0 var(--line)}
label{display:block;font-weight:800;margin:16px 0 8px}
label:first-child{margin-top:0}
input,textarea{width:100%;font:inherit;padding:15px 16px;border:3px solid var(--line);border-radius:16px;background:#fafbfd}
input:focus,textarea:focus{outline:none;border-color:var(--navy)}
textarea{min-height:130px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send{width:100%;margin-top:22px}
#msg{margin-top:14px;font-weight:800;text-align:center}
.ok{color:#127a3d}.err{color:#c0262d}

.info{text-align:center;padding:10px 0 36px;font-weight:700}
.info a{color:var(--navy2);font-weight:900;text-decoration:none;display:inline-block;margin:4px 12px}
footer{text-align:center;color:var(--mut);font-size:14px;padding-bottom:12px}

/* 따라오는 큰 버튼 */
.fab{position:fixed;left:16px;right:16px;bottom:14px;z-index:10;max-width:420px;margin:0 auto;text-align:center;padding:16px;border-radius:999px;font-size:18px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a class="logo" href="#"><img src="images/mascot.png" alt="" width="44" height="39">술술 일본어</a>
    <a class="mini" href="#ask">문의하기</a>
  </div>

  <header class="hero">
    <img class="mascot" src="images/mascot.png" alt="술술 일본어 참새 캐릭터" width="190" height="168">
    <h1>일본어 초보도<br><em>쉽고 재밌게!</em></h1>
    <p>히라가나부터 하루 5분씩, 게임하면서 즐겁게 배워요</p>
    <a class="btn" href="#ask">문의하기</a>
  </header>
</div>

<section class="learn">
  <div class="wrap">
    <h2>앱에서 이런 걸 해요</h2>
    <p class="lead">눌러서 바로 시작하는 6가지</p>
    <div class="tiles">
      <div class="tile t1"><i>あ</i><span>글자</span></div>
      <div class="tile t2"><i>単</i><span>단어장</span></div>
      <div class="tile t3"><i>問</i><span>퀴즈</span></div>
      <div class="tile t4"><i>試</i><span>모의시험</span></div>
      <div class="tile t5"><i>遊</i><span>게임</span></div>
      <div class="tile t6"><i>ア</i><span>애니</span></div>
    </div>
    <p class="note">하루 5분이면 충분해요</p>
  </div>
</section>

<section class="play" id="play">
  <div class="wrap">
    <h2>1분 체험해 보세요</h2>
    <p class="lead">글자를 보고 소리를 맞혀 보세요</p>
    <div class="game" id="game" aria-live="polite"></div>
  </div>
</section>

<section class="ask" id="ask">
  <div class="wrap">
    <h2>궁금한 게 있나요?</h2>
    <p class="lead">남겨 주시면 연락드릴게요</p>
    <form id="f" novalidate>
      <label for="name">이름</label>
      <input id="name" name="name" maxlength="50" autocomplete="name" required>
      <label for="contactInfo">연락처 (전화번호 또는 이메일)</label>
      <input id="contactInfo" name="contact" maxlength="100" autocomplete="off" required>
      <label for="message">문의 내용</label>
      <textarea id="message" name="message" maxlength="1000" required></textarea>
      <div class="hp" aria-hidden="true"><label>비워 두세요<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn send" type="submit" id="send">보내기</button>
      <div id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<div class="wrap info">
  <a href="tel:01042826238">전화 010-4282-6238</a>
  <a href="mailto:dkscldms6233@gmail.com">dkscldms6233@gmail.com</a>
</div>
<footer>© 술술 일본어 すらすら日本語</footer>

<a class="btn fab" href="#ask">문의하기</a>

<script>
(function(){
  const P=[['あ','아'],['い','이'],['う','우'],['え','에'],['お','오'],['か','카'],['き','키'],['く','쿠'],['け','케'],['こ','코'],['さ','사'],['し','시'],['す','스'],['せ','세'],['そ','소'],['た','타'],['ち','치'],['つ','츠'],['て','테'],['と','토'],['な','나'],['に','니'],['ぬ','누'],['ね','네'],['の','노'],['は','하'],['ひ','히'],['ふ','후'],['へ','헤'],['ほ','호'],['ま','마'],['み','미'],['む','무'],['め','메'],['も','모'],['ら','라'],['り','리'],['る','루'],['れ','레'],['ろ','로']];
  const N=5,box=document.getElementById('game');
  let qs,i,score,locked;
  const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  function start(){qs=shuffle(P).slice(0,N);i=0;score=0;show()}
  function show(){
    locked=false;
    const q=qs[i];
    const wrong=shuffle(P.filter(p=>p[1]!==q[1])).slice(0,3).map(p=>p[1]);
    const opts=shuffle([q[1],...wrong]);
    box.innerHTML='<div class="gbar"><i style="width:'+(i/N*100)+'%"></i></div><div class="gcount">'+(i+1)+' / '+N+'</div><div class="big">'+q[0]+'</div><div class="ask-q">이 글자는 어떻게 읽을까요?</div><div class="opts">'+opts.map(o=>'<button class="opt" type="button">'+o+'</button>').join('')+'</div><div class="fb"></div>';
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q[1]));
  }
  function pick(b,ans){
    if(locked)return;locked=true;
    const ok=b.textContent===ans,fb=box.querySelector('.fb');
    if(ok){score++;b.classList.add('right');fb.textContent='정답!';fb.style.color='#127a3d'}
    else{b.classList.add('wrong');box.querySelectorAll('.opt').forEach(o=>{if(o.textContent===ans)o.classList.add('right')});fb.textContent='아쉬워요! 정답은 '+ans;fb.style.color='#c0262d'}
    setTimeout(()=>{i++;i<N?show():end()},ok?700:1300);
  }
  function end(){
    const m=score===N?'완벽해요! 이미 히라가나 고수예요':score>=3?'잘했어요! 조금만 더 하면 술술!':'괜찮아요, 처음엔 누구나 그래요';
    box.innerHTML='<div class="gbar"><i style="width:100%"></i></div><div class="ask-q">내 점수</div><div class="score">'+score+' / '+N+'</div><div class="fb" style="color:var(--navy2)">'+m+'</div><div class="row"><button class="btn light" type="button" id="again">다시 하기</button><a class="btn" href="#ask">문의하기</a></div>';
    document.getElementById('again').onclick=start;
  }
  start();
})();
const f=document.getElementById('f'),msg=document.getElementById('msg'),send=document.getElementById('send');
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  msg.className='';
  if(!d.name.trim()||!d.contact.trim()||!d.message.trim()){msg.textContent='이름, 연락처, 문의 내용을 모두 적어 주세요.';msg.className='err';return}
  send.disabled=true;msg.textContent='보내는 중…';
  try{
    const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    const j=await r.json().catch(()=>({}));
    if(r.ok){msg.textContent='문의가 접수됐어요. 곧 연락드릴게요!';msg.className='ok';f.reset()}
    else{msg.textContent=j.error||'보내지 못했어요. 잠시 뒤 다시 시도해 주세요.';msg.className='err'}
  }catch(_){msg.textContent='인터넷 연결을 확인하고 다시 시도해 주세요.';msg.className='err'}
  send.disabled=false;
});
</script>
</body>
</html>
